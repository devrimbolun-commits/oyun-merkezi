function startSpinner(box){var angle=0,vel=0,sc=0,sp=document.createElement('div');sp.style.cssText='font-size:130px;cursor:pointer;';sp.innerText='🌀';sp.onpointerdown=function(){vel+=18;beep(420);};box.appendChild(sp);function loop(){if(vel>0.1){angle+=vel;vel*=0.985;sc+=Math.floor(vel/5);setScore(sc);sp.style.transform='rotate('+angle+'deg)';}activeLoop=requestAnimationFrame(loop);}loop();}
function startDoodle(box){var c=document.createElement('canvas');c.width=280;c.height=400;box.appendChild(c);var ctx=c.getContext('2d'),px=140,py=300,vy=-8,plats=[{x:100,y:350},{x:50,y:250},{x:170,y:150},{x:90,y:50}],sc=0;c.onpointermove=function(e){var r=c.getBoundingClientRect();px=(e.clientX-r.left)*(280/r.width);};function loop(){vy+=0.3;py+=vy;if(py<180){var d=180-py;py=180;sc+=Math.floor(d/5);setScore(sc);plats.forEach(function(p){p.y+=d;if(p.y>400){p.y=0;p.x=Math.random()*210;}});}plats.forEach(function(p){if(vy>0&&px>p.x-12&&px<p.x+72&&py>p.y-15&&py<p.y+5){vy=-9.5;beep(520);}});if(py>410){py=300;vy=-9;sc=0;setScore(0);beep(150,'sawtooth');}ctx.fillStyle='#0f172a';ctx.fillRect(0,0,280,400);ctx.fillStyle='#22c55e';plats.forEach(function(p){ctx.fillRect(p.x,p.y,60,10);});ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(px,py,12,0,Math.PI*2);ctx.fill();activeLoop=requestAnimationFrame(loop);}loop();}
function startCar(box){var c=document.createElement('canvas');c.width=260;c.height=400;box.appendChild(c);var ctx=c.getContext('2d'),lane=1,cars=[],f=0,sc=0;c.onpointerdown=function(e){var r=c.getBoundingClientRect();lane=(e.clientX-r.left)<r.width/2?Math.max(0,lane-1):Math.min(2,lane+1);beep(400);};function loop(){f++;if(f%38===0){cars.push({l:Math.floor(Math.random()*3),y:-40});sc+=10;setScore(sc);}ctx.fillStyle='#1e293b';ctx.fillRect(0,0,260,400);ctx.fillStyle='#ef4444';for(var i=cars.length-1;i>=0;i--){var cr=cars[i];cr.y+=5;ctx.fillRect(cr.l*85+22,cr.y,45,65);if(cr.l===lane&&cr.y>275&&cr.y<365){cars=[];sc=0;setScore(0);beep(140,'sawtooth');break;}}ctx.fillStyle='#38bdf8';ctx.fillRect(lane*85+22,310,45,65);activeLoop=requestAnimationFrame(loop);}loop();}
function startKnife(box){var c=document.createElement('canvas');c.width=280;c.height=400;box.appendChild(c);var ctx=c.getContext('2d'),ang=0,stuck=[],sc=0;c.onpointerdown=function(){var hit=((Math.PI/2-ang)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);if(stuck.some(function(s){return Math.abs(s-hit)<0.28;})){stuck=[];sc=0;setScore(0);beep(150,'sawtooth');}else{stuck.push(hit);sc++;setScore(sc);beep(650);}};function loop(){ang+=0.04;ctx.fillStyle='#0f172a';ctx.fillRect(0,0,280,400);stuck.forEach(function(s){var a=ang+s;ctx.strokeStyle='#94a3b8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(140,130);ctx.lineTo(140+Math.cos(a)*85,130+Math.sin(a)*85);ctx.stroke();});ctx.fillStyle='#d97706';ctx.beginPath();ctx.arc(140,130,50,0,Math.PI*2);ctx.fill();ctx.fillStyle='#38bdf8';ctx.fillRect(137,330,6,40);activeLoop=requestAnimationFrame(loop);}loop();}
function startArcher(box){var c=document.createElement('canvas');c.width=280;c.height=380;box.appendChild(c);var ctx=c.getContext('2d'),ty=60,tdir=3,ay=330,flying=false,sc=0;c.onpointerdown=function(){if(!flying){flying=true;beep(500);}};function loop(){ty+=tdir;if(ty<30||ty>200)tdir=-tdir;if(flying){ay-=12;if(ay<60&&Math.abs(ty-110)<35){sc+=10;setScore(sc);beep(750);flying=false;ay=330;}if(ay<0){flying=false;ay=330;}}ctx.fillStyle='#0f172a';ctx.fillRect(0,0,280,380);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(140,ty,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#facc15';ctx.fillRect(138,ay,4,30);activeLoop=requestAnimationFrame(loop);}loop();}
function startBalloon(box){var sc=0,area=document.createElement('div');area.style.cssText='width:100%;height:100%;position:relative;';box.appendChild(area);activeLoop=setInterval(function(){var b=document.createElement('div');b.style.cssText='position:absolute;left:'+(10+Math.random()*75)+'%;bottom:0;font-size:44px;transition:bottom 2.5s linear;';b.innerText=['🎈','🟢','🔵','🟡'][Math.floor(Math.random()*4)];b.onpointerdown=function(){sc+=5;setScore(sc);beep(680);b.remove();};area.appendChild(b);setTimeout(function(){b.style.bottom='90%';},20);setTimeout(function(){if(b.parentNode)b.remove();},2500);},550);}
function startGravity(box){var c=document.createElement('canvas');c.width=300;c.height=300;box.appendChild(c);var ctx=c.getContext('2d'),top=false,obs=[],f=0,sc=0;c.onpointerdown=function(){top=!top;beep(520);};function loop(){f++;if(f%40===0){obs.push({x:300,top:Math.random()<0.5});sc++;setScore(sc);}ctx.fillStyle='#0f172a';ctx.fillRect(0,0,300,300);ctx.fillStyle='#ef4444';for(var i=obs.length-1;i>=0;i--){var o=obs[i];o.x-=4;var y=o.top?20:250;ctx.fillRect(o.x,y,24,30);if(o.x<65&&o.x>25&&o.top===top){obs=[];sc=0;setScore(0);beep(150,'sawtooth');break;}}ctx.fillStyle='#22c55e';ctx.fillRect(40,top?20:250,26,30);activeLoop=requestAnimationFrame(loop);}loop();}
function startTower(box){var c=document.createElement('canvas');c.width=280;c.height=400;box.appendChild(c);var ctx=c.getContext('2d'),stack=[{x:80,w:120}],cur={x:0,w:120,dir:3},sc=0;c.onpointerdown=function(){var prev=stack[stack.length-1],overlap=Math.min(cur.x+cur.w,prev.x+prev.w)-Math.max(cur.x,prev.x);if(overlap<=5){stack=[{x:80,w:120}];cur={x:0,w:120,dir:3};sc=0;setScore(0);beep(150,'sawtooth');}else{sc++;setScore(sc);stack.push({x:Math.max(cur.x,prev.x),w:overlap});cur={x:0,w:overlap,dir:3+sc*0.2};beep(450+sc*20);if(stack.length>12)stack.shift();}};function loop(){cur.x+=cur.dir;if(cur.x<0||cur.x+cur.w>280)cur.dir=-cur.dir;ctx.fillStyle='#0f172a';ctx.fillRect(0,0,280,400);stack.forEach(function(s,i){ctx.fillStyle='hsl('+(i*25)+',75%,55%)';ctx.fillRect(s.x,370-i*24,s.w,22);});ctx.fillStyle='#fff';ctx.fillRect(cur.x,370-stack.length*24,cur.w,22);activeLoop=requestAnimationFrame(loop);}loop();}
function startGolf(box){var c=document.createElement('canvas');c.width=280;c.height=400;box.appendChild(c);var ctx=c.getContext('2d'),bx=140,by=340,vx=0,vy=0,hx=140,sc=0;c.onpointerdown=function(e){if(Math.hypot(vx,vy)<0.2){var r=c.getBoundingClientRect(),tx=(e.clientX-r.left)*(280/r.width),ty=(e.clientY-r.top)*(400/r.height);vx=(tx-bx)*0.06;vy=(ty-by)*0.06;beep(450);}};function loop(){bx+=vx;by+=vy;vx*=0.97;vy*=0.97;if(bx<10||bx>270)vx=-vx;if(by<10||by>390)vy=-vy;if(Math.hypot(bx-hx,by-70)<18){sc++;setScore(sc);beep(750);bx=140;by=340;vx=0;vy=0;hx=40+Math.random()*200;}ctx.fillStyle='#14532d';ctx.fillRect(0,0,280,400);ctx.fillStyle='#000';ctx.beginPath();ctx.arc(hx,70,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,9,0,Math.PI*2);ctx.fill();activeLoop=requestAnimationFrame(loop);}loop();}
