<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>50 Oyun Offline - Arcade Merkezi</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --accent: #f59e0b; --text: #f8fafc; --muted: #94a3b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  #launcher { display: flex; flex-direction: column; height: 100%; }
  header { padding: 14px 16px; background: linear-gradient(135deg, #1e293b, #0f172a); border-bottom: 1px solid #334155; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .logo { font-size: 19px; font-weight: 900; background: linear-gradient(to right, #fbbf24, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .badge { background: #10b98122; color: #34d399; border: 1px solid #10b98155; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .search-box { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 7px 14px; border-radius: 20px; background: var(--card); color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; border: 1px solid #334155; }
  .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

  .games-grid { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start; }
  .game-card { background: var(--card); border-radius: 16px; padding: 14px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
  .game-card:active { transform: scale(0.96); }
  .game-icon { font-size: 38px; margin-bottom: 6px; }
  .game-title { font-size: 13px; font-weight: 800; margin-bottom: 3px; }
  .game-cat { font-size: 11px; color: var(--muted); }
  .fav-btn { position: absolute; top: 8px; right: 10px; font-size: 16px; opacity: 0.5; }
  .fav-btn.is-fav { opacity: 1; }
  .tag-ready { position: absolute; top: 8px; left: 8px; background: #22c55e; color: #052e16; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 6px; }

  #game-stage { display: none; flex-direction: column; height: 100%; background: #090d16; }
  .stage-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #1e293b; border-bottom: 1px solid #334155; }
  .back-btn { background: #ef4444; color: #fff; border: none; padding: 7px 14px; border-radius: 10px; font-weight: 800; font-size: 13px; }
  .stage-title { font-weight: 800; font-size: 14px; }
  .stage-score { font-weight: 900; color: var(--accent); font-size: 15px; }
  #game-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }

  canvas { background: #0f172a; border-radius: 12px; border: 2px solid #334155; max-width: 100%; max-height: 82%; touch-action: none; }
  .btn-ui { padding: 12px 20px; border-radius: 14px; border: none; background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; font-size: 15px; font-weight: 900; margin: 5px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 92%; max-width: 340px; background: #1e293b; padding: 10px; border-radius: 16px; }
  .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 92%; max-width: 340px; background: #1e293b; padding: 8px; border-radius: 14px; }
  .cell-sq { aspect-ratio: 1; background: #0f172a; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; position: relative; border: 2px solid #334155; }
  .cell-sq span { font-size: 10px; background: #f59e0b; color: #000; padding: 1px 5px; border-radius: 6px; position: absolute; bottom: 3px; }
  .cell-sq.selected { border-color: #22c55e; background: #14532d55; }
  .duel-wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .duel-half { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; text-align: center; padding: 12px; }
</style>
</head>
<body>

<div id="launcher">
  <header>
    <div class="top-row">
      <div class="logo">🎮 50 OYUN OFFLINE (30/50)</div>
      <div class="badge">✈️ İNTERNETSİZ</div>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="30 oyun içinde ara..." oninput="renderGames()">
  </header>

  <div class="tabs">
    <div class="tab active" onclick="setCat('hepsi', this)">🔥 Tümü (30)</div>
    <div class="tab" onclick="setCat('favori', this)">⭐ Favoriler</div>
    <div class="tab" onclick="setCat('arcade', this)">🕹️ Arcade</div>
    <div class="tab" onclick="setCat('zeka', this)">🧠 Zeka</div>
    <div class="tab" onclick="setCat('2kisilik', this)">👥 2 Kişilik</div>
    <div class="tab" onclick="setCat('stres', this)">🫧 Rahatlatıcı</div>
  </div>

  <div class="games-grid" id="gamesGrid"></div>
</div>

<div id="game-stage">
  <div class="stage-bar">
    <button class="back-btn" onclick="closeGame()">⬅ Çıkış</button>
    <div class="stage-title" id="stageTitle">Oyun</div>
    <div class="stage-score" id="stageScore">0</div>
  </div>
  <div id="game-container"></div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq = 440, type = 'sine', dur = 0.09) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

const GAMES = [
  { id: 'merge', title: 'Yaratık Birleştirme', icon: '🐉', cat: 'zeka', catName: 'Zeka & Evrim' },
  { id: 'snake', title: 'Klasik Yılan', icon: '🐍', cat: 'arcade', catName: 'Arcade' },
  { id: 'flappy', title: 'Zıplayan Kuş', icon: '🐤', cat: 'arcade', catName: 'Refleks' },
  { id: 'duel', title: '2K Parmak Güreşi', icon: '🥊', cat: '2kisilik', catName: '2 Kişilik' },
  { id: 'memory', title: 'Kart Eşleştirme', icon: '🃏', cat: 'zeka', catName: 'Hafıza' },
  { id: 'breakout', title: 'Tuğla Kırma', icon: '🧱', cat: 'arcade', catName: 'Klasik Arcade' },
  { id: 'space', title: 'Uzay Savaşı', icon: '🚀', cat: 'arcade', catName: 'Aksiyon' },
  { id: 'meteor', title: 'Meteor Yağmuru', icon: '☄️', cat: 'arcade', catName: 'Refleks' },
  { id: 'colortap', title: 'Renk Tuzakları', icon: '🎨', cat: 'arcade', catName: 'Hız & Refleks' },
  { id: 'math', title: 'Hızlı Matematik', icon: '➕', cat: 'zeka', catName: 'Beyin Jimnastiği' },
  { id: 'g2048', title: '2048 Bulmaca', icon: '🔢', cat: 'zeka', catName: 'Sayı Zekası' },
  { id: 'guess', title: 'Sayı Tahmin Ustası', icon: '🔮', cat: 'zeka', catName: 'Mantık' },
  { id: 'xox', title: '2K XOX Oyunu', icon: '❌', cat: '2kisilik', catName: '2 Kişilik' },
  { id: 'react2p', title: '2K Refleks Düellosu', icon: '⚡', cat: '2kisilik', catName: '2 Kişilik' },
  { id: 'popit', title: 'Baloncuk Patlatma', icon: '🫧', cat: 'stres', catName: 'Stres Atma' },
  { id: 'mole', title: 'Köstebek Vurmaca', icon: '🐹', cat: 'arcade', catName: 'Hızlı Dokunuş' },
  { id: 'fruit', title: 'Meyve Yakalama', icon: '🍎', cat: 'arcade', catName: 'Refleks' },
  { id: 'basket', title: 'Basketbol Atışı', icon: '🏀', cat: 'arcade', catName: 'Spor Arcade' },
  { id: 'penalty', title: 'Penaltı Şutu', icon: '⚽', cat: 'arcade', catName: 'Futbol' },
  { id: 'heli', title: 'Helikopter Tüneli', icon: '🚁', cat: 'arcade', catName: 'Uçuş' },
  { id: 'mines', title: 'Mayın Tarlası', icon: '💣', cat: 'zeka', catName: 'Strateji' },
  { id: 'simon', title: 'Simon Hafıza Işıkları', icon: '💡', cat: 'zeka', catName: 'Hafıza' },
  { id: 'rps', title: 'Taş Kağıt Makas', icon: '✌️', cat: 'zeka', catName: 'Klasik' },
  { id: 'word', title: 'Kelime Karıştırma', icon: '🔤', cat: 'zeka', catName: 'Kelime Zekası' },
  { id: 'code', title: 'Şifre Kırıcı', icon: '🔐', cat: 'zeka', catName: 'Mantık' },
  { id: 'hockey', title: '2K Hava Hokeyi', icon: '🏒', cat: '2kisilik', catName: '2 Kişilik' },
  { id: 'pong2p', title: '2K Mini Pong', icon: '🏓', cat: '2kisilik', catName: '2 Kişilik' },
  { id: 'math2p', title: '2K Matematik Yarışı', icon: '🧮', cat: '2kisilik', catName: '2 Kişilik' },
  { id: 'piano', title: 'Mini Piyano', icon: '🎹', cat: 'stres', catName: 'Müzik & Ritim' },
  { id: 'spinner', title: 'Stres Çarkı', icon: '🌀', cat: 'stres', catName: 'Rahatlatıcı' }
];

let currentCat = 'hepsi', favs = JSON.parse(localStorage.getItem('offline_favs') || '[]'), activeLoop = null, activeTimers = [];

function setCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderGames();
}

function toggleFav(e, id) {
  e.stopPropagation();
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
  localStorage.setItem('offline_favs', JSON.stringify(favs));
  renderGames();
}

function renderGames() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';
  GAMES.filter(g => (currentCat === 'hepsi' || (currentCat === 'favori' && favs.includes(g.id)) || g.cat === currentCat) && g.title.toLowerCase().includes(q))
    .forEach(g => {
      const isFav = favs.includes(g.id);
      const card = document.createElement('div');
      card.className = 'game-card';
      card.onclick = () => launchGame(g);
      card.innerHTML = `<span class="tag-ready">OYNA</span><span class="fav-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFav(event, '${g.id}')">${isFav ? '⭐' : '☆'}</span><div class="game-icon">${g.icon}</div><div class="game-title">${g.title}</div><div class="game-cat">${g.catName}</div>`;
      grid.appendChild(card);
    });
}

function closeGame() {
  if (activeLoop) { clearInterval(activeLoop); cancelAnimationFrame(activeLoop); activeLoop = null; }
  activeTimers.forEach(t => clearTimeout(t)); activeTimers = [];
  document.getElementById('game-stage').style.display = 'none';
  document.getElementById('launcher').style.display = 'flex';
  document.getElementById('game-container').innerHTML = '';
}

function setScore(s) { document.getElementById('stageScore').innerText = s; }

function launchGame(g) {
  beep(520, 'triangle', 0.1);
  document.getElementById('launcher').style.display = 'none';
  document.getElementById('game-stage').style.display = 'flex';
  document.getElementById('stageTitle').innerText = g.icon + ' ' + g.title;
  setScore(0);
  const box = document.getElementById('game-container');
  box.innerHTML = '';
  const map = {
    merge: startMerge, snake: startSnake, flappy: startFlappy, duel: startDuel, memory: startMemory,
    breakout: startBreakout, space: startSpace, meteor: startMeteor, colortap: startColorTap, math: startMath,
    g2048: start2048, guess: startGuess, xox: startXOX, react2p: startReact2P, popit: startPopIt,
    mole: startMole, fruit: startFruit, basket: startBasket, penalty: startPenalty, heli: startHeli,
    mines: startMines, simon: startSimon, rps: startRPS, word: startWord, code: startCode,
    hockey: startHockey, pong2p: startPong2P, math2p: startMath2P, piano: startPiano, spinner: startSpinner
  };
  if (map[g.id]) map[g.id](box);
}

/* 1-15 OYUNLAR */
function startMerge(box) {
  const m = ['', '🥚', '🐣', '🐸', '🦊', '🦁', '🦖', '🦄', '👾', '🐲', '👑'];
  let grid = Array(16).fill(0), sel = -1, sc = 0; grid[0] = 1; grid[1] = 1;
  const gEl = document.createElement('div'); gEl.className = 'grid-4';
  const btn = document.createElement('button'); btn.className = 'btn-ui'; btn.innerText = '🥚 Yumurta Çıkar';
  const draw = () => {
    gEl.innerHTML = '';
    grid.forEach((lvl, i) => {
      const c = document.createElement('div'); c.className = 'cell-sq' + (sel === i ? ' selected' : '');
      if (lvl > 0) c.innerHTML = `${m[lvl]}<span>Sv.${lvl}</span>`;
      c.onclick = () => {
        if (!lvl) { sel = -1; draw(); return; }
        if (sel === -1) { sel = i; beep(350); }
        else if (sel === i) sel = -1;
        else if (grid[sel] === grid[i] && grid[i] < 10) { grid[i]++; grid[sel] = 0; sel = -1; sc += grid[i]*10; setScore(sc); beep(680, 'triangle', 0.14); }
        else sel = i;
        draw();
      }; gEl.appendChild(c);
    });
  };
  btn.onclick = () => { const emp = grid.map((v, i) => v === 0 ? i : -1).filter(i => i !== -1); if (emp.length) { grid[emp[Math.floor(Math.random()*emp.length)]] = 1; beep(480); draw(); } };
  box.append(gEl, btn); draw();
}

function startSnake(box) {
  const c = document.createElement('canvas'); c.width = 300; c.height = 300; box.appendChild(c);
  const ctx = c.getContext('2d'); let s = [{x:7,y:7}], d = {x:1,y:0}, f = {x:10,y:10}, sc = 0, sx = 0, sy = 0;
  c.ontouchstart = e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
  c.ontouchend = e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; d = Math.abs(dx) > Math.abs(dy) ? (dx>0?{x:1,y:0}:{x:-1,y:0}) : (dy>0?{x:0,y:1}:{x:0,y:-1}); };
  activeLoop = setInterval(() => {
    const h = {x:(s[0].x+d.x+15)%15, y:(s[0].y+d.y+15)%15};
    if (s.some(p => p.x===h.x && p.y===h.y)) { s=[{x:7,y:7}]; sc=0; setScore(0); beep(180,'sawtooth'); }
    s.unshift(h);
    if (h.x===f.x && h.y===f.y) { sc+=10; setScore(sc); f={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)}; beep(600); } else s.pop();
    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,300,300); ctx.fillStyle='#ef4444'; ctx.fillRect(f.x*20+2,f.y*20+2,16,16);
    ctx.fillStyle='#22c55e'; s.forEach(p=>ctx.fillRect(p.x*20+1,p.y*20+1,18,18));
  }, 140);
}

function startFlappy(box) {
  const c = document.createElement('canvas'); c.width = 300; c.height = 400; box.appendChild(c);
  const ctx = c.getContext('2d'); let y = 200, vy = 0, px = 300, gy = 130, sc = 0;
  c.onpointerdown = () => { vy = -6.2; beep(500); };
  const loop = () => {
    vy += 0.34; y += vy; px -= 3;
    if (px < -40) { px = 300; gy = 60+Math.random()*180; sc++; setScore(sc); beep(700); }
    if (y<0 || y>390 || (px<75 && px>15 && (y<gy || y>gy+110))) { y=200; vy=0; px=300; sc=0; setScore(0); beep(150,'sawtooth'); }
    ctx.fillStyle='#0284c7'; ctx.fillRect(0,0,300,400); ctx.fillStyle='#22c55e'; ctx.fillRect(px,0,45,gy); ctx.fillRect(px,gy+110,45,400);
    ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(50,y,14,0,Math.PI*2); ctx.fill();
    activeLoop = requestAnimationFrame(loop);
  }; loop();
}

function startDuel(box) {
  let p1 = 50; const w = document.createElement('div'); w.className = 'duel-wrap';
  w.innerHTML = `<div class="duel-half" id="dp2" style="background:#ef4444;transform:rotate(180deg)">🔴 HIZLI DOKUN!</div><div class="duel-half" id="dp1" style="background:#3b82f6">🔵 HIZLI DOKUN!</div>`;
  box.appendChild(w);
  const up = () => { document.getElementById('dp1').style.flex = p1; document.getElementById('dp2').style.flex = 100-p1; if (p1>=95){alert('🔵 MAVİ KAZANDI!');p1=50;up();} if (p1<=5){alert('🔴 KIRMIZI KAZANDI!');p1=50;up();} };
  document.getElementById('dp1').onpointerdown = () => { p1+=4; beep(550); up(); };
  document.getElementById('dp2').onpointerdown = () => { p1-=4; beep(420); up(); };
}

function startMemory(box) {
  const ic = ['🐶','🐱','🦁','🐸','🐵','🦊','🐼','🐨'], deck = [...ic,...ic].sort(()=>Math.random()-0.5);
  let op = [], m = 0; const g = document.createElement('div'); g.className = 'grid-4';
  deck.forEach(sym => {
    const c = document.createElement('div'); c.className = 'cell-sq'; c.style.background='#3b82f6'; c.innerText = '?';
    c.onclick = () => {
      if (op.length===2 || c.dataset.open) return;
      c.dataset.open='1'; c.style.background='#1e293b'; c.innerText=sym; beep(460); op.push({c,sym});
      if (op.length===2) {
        if (op[0].sym===op[1].sym) { m+=2; op=[]; setScore(m*10); beep(700); }
        else activeTimers.push(setTimeout(()=>{ op.forEach(o=>{delete o.c.dataset.open; o.c.style.background='#3b82f6'; o.c.innerText='?';}); op=[]; }, 600));
      }
    }; g.appendChild(c);
  }); box.appendChild(g);
}

function startBreakout(box) {
  const c = document.createElement('canvas'); c.width = 300; c.height = 400; box.appendChild(c);
  const ctx = c.getContext('2d'); let px = 110, bx = 150, by = 250, vx = 3, vy = -3, sc = 0;
  let bricks = []; for(let r=0;r<4;r++) for(let col=0;col<5;col++) bricks.push({x:col*58+8, y:r*24+30, alive:true});
  c.onpointermove = e => { const r = c.getBoundingClientRect(); px = Math.max(0, Math.min(220, (e.clientX - r.left)*(300/r.width) - 40)); };
  const loop = () => {
    bx += vx; by += vy;
    if (bx<8 || bx>292) vx = -vx;
    if (by<8) vy = -vy;
    if (by>365 && bx>px && bx<px+80) { vy = -Math.abs(vy); beep(500); }
    if (by>400) { bx=150; by=250; vy=-3; sc=0; setScore(0); bricks.forEach(b=>b.alive=true); beep(160,'sawtooth'); }
    bricks.forEach(b => { if (b.alive && bx>b.x && bx<b.x+52 && by>b.y && by<b.y+18) { b.alive=false; vy=-vy; sc+=10; setScore(sc); beep(650); } });
    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,300,400); ctx.fillStyle='#f59e0b'; bricks.forEach(b => { if(b.alive) ctx.fillRect(b.x,b.y,52,18); });
    ctx.fillStyle='#38bdf8'; ctx.fillRect(px,375,80,12); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,by,7,0,Math.PI*2); ctx.fill();
    activeLoop = requestAnimationFrame(loop);
  }; loop();
}

function startSpace(box) {
  const c = document.createElement('canvas'); c.width = 300; c.height = 400; box.appendChild(c);
  const ctx = c.getContext('2d'); let sx = 150, bullets = [], enemies = [], frame = 0, sc = 0;
  c.onpointermove = e => { const r = c.getBoundingClientRect(); sx = (e.clientX - r.left)*(300/r.width); };
  const loop = () => {
    frame++;
    if (frame % 18 === 0) { bullets.push({x:sx, y:350}); beep(750,'sine',0.04); }
    if (frame % 45 === 0) enemies.push({x:20+Math.random()*260, y:0});
    ctx.fillStyle='#090d16'; ctx.fillRect(0,0,300,400);
    ctx.fillStyle='#facc15'; bullets.forEach((b,i)=>{ b.y-=7; ctx.fillRect(b.x-2,b.y,4,10); if(b.y<0) bullets.splice(i,1); });
    ctx.fillStyle='#ef4444';
    enemies.forEach((en,ei) => {
      en.y += 2.5; ctx.fillRect(en.x-14,en.y-14,28,28);
      if (en.y>380) { enemies=[]; sc=0; setScore(0); beep(150,'sawtooth'); }
      bullets.forEach((b,bi) => { if(Math.abs(b.x-en.x)<18 && Math.abs(b.y-en.y)<18) { enemies.splice(ei,1); bullets.splice(bi,1); sc+=10; setScore(sc); beep(400); } });
    });
    ctx.fillStyle='#38bdf8'; ctx.beginPath(); ctx.moveTo(sx,350); ctx.lineTo(sx-16,380); ctx.lineTo(sx+16,380); ctx.fill();
    activeLoop = requestAnimationFrame(loop);
  }; loop();
}

function startMeteor(box) {
  const c = document.createElement('canvas'); c.width = 300; c.height = 400; box.appendChild(c);
  const ctx = c.getContext('2d'); let px = 150, obs = [], frame = 0, sc = 0;
