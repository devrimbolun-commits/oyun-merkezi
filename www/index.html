<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>50 Oyun Offline - Arcade Merkezi</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #f59e0b;
    --accent2: #3b82f6;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* ANA MENÜ ARAYÜZÜ */
  #launcher { display: flex; flex-direction: column; height: 100%; }
  header { padding: 16px; background: linear-gradient(135deg, #1e293b, #0f172a); border-bottom: 1px solid #334155; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .logo { font-size: 20px; font-weight: 900; background: linear-gradient(to right, #fbbf24, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .badge { background: #10b98122; color: #34d399; border: 1px solid #10b98155; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }

  .search-box { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
  .search-box:focus { border-color: var(--accent); }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 14px; border-radius: 20px; background: var(--card); color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; border: 1px solid #334155; cursor: pointer; }
  .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

  .games-grid { flex: 1; overflow-y: auto; padding: 0 16px 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start; }
  .game-card { background: var(--card); border-radius: 16px; padding: 14px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; transition: transform 0.12s; cursor: pointer; }
  .game-card:active { transform: scale(0.96); }
  .game-icon { font-size: 42px; margin-bottom: 8px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
  .game-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  .game-cat { font-size: 11px; color: var(--muted); }
  .fav-btn { position: absolute; top: 8px; right: 10px; font-size: 16px; opacity: 0.5; }
  .fav-btn.is-fav { opacity: 1; }
  .tag-ready { position: absolute; top: 8px; left: 8px; background: #22c55e; color: #052e16; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 6px; }

  /* OYUN SAHNESİ ÇERÇEVESİ */
  #game-stage { display: none; flex-direction: column; height: 100%; background: #090d16; }
  .stage-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #1e293b; border-bottom: 1px solid #334155; }
  .back-btn { background: #ef4444; color: #fff; border: none; padding: 7px 14px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .stage-title { font-weight: 800; font-size: 15px; }
  .stage-score { font-weight: 900; color: var(--accent); font-size: 15px; }
  #game-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* MİNİ OYUN ÖZEL STİLLERİ */
  canvas { background: #0f172a; border-radius: 12px; border: 2px solid #334155; max-width: 95%; max-height: 85%; touch-action: none; }
  .merge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 92%; max-width: 360px; background: #1e293b; padding: 10px; border-radius: 16px; }
  .m-cell { aspect-ratio: 1; background: #0f172a; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; position: relative; border: 2px solid #334155; }
  .m-cell span { font-size: 10px; background: #f59e0b; color: #000; font-weight: 900; padding: 1px 5px; border-radius: 6px; position: absolute; bottom: 4px; }
  .m-cell.selected { border-color: #22c55e; transform: scale(1.06); background: #14532d55; }
  .big-action { margin-top: 14px; padding: 14px 28px; border-radius: 16px; border: none; background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; font-size: 16px; font-weight: 900; box-shadow: 0 4px 15px #f59e0b55; }

  /* 2 KİŞİLİK PARMAK GÜREŞİ */
  .duel-wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .duel-p2 { flex: 1; background: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; transform: rotate(180deg); }
  .duel-p1 { flex: 1; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; }

  /* HAFIZA OYUNU */
  .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 92%; max-width: 360px; }
  .mem-card { aspect-ratio: 1; background: #3b82f6; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; cursor: pointer; }
  .mem-card.open { background: #1e293b; border: 2px solid #f59e0b; }
</style>
</head>
<body>

<div id="launcher">
  <header>
    <div class="top-row">
      <div class="logo">🎮 50 OYUN OFFLINE</div>
      <div class="badge">✈️ İNTERNETSİZ</div>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="Oyun ara (Yılan, Merge, 2 Kişilik...)" oninput="renderGames()">
  </header>

  <div class="tabs" id="categoryTabs">
    <div class="tab active" onclick="setCat('hepsi', this)">🔥 Tümü</div>
    <div class="tab" onclick="setCat('favori', this)">⭐ Favoriler</div>
    <div class="tab" onclick="setCat('arcade', this)">🕹️ Arcade</div>
    <div class="tab" onclick="setCat('zeka', this)">🧠 Zeka</div>
    <div class="tab" onclick="setCat('2kisilik', this)">👥 2 Kişilik</div>
  </div>

  <div class="games-grid" id="gamesGrid"></div>
</div>

<div id="game-stage">
  <div class="stage-bar">
    <button class="back-btn" onclick="closeGame()">⬅ Çıkış</button>
    <div class="stage-title" id="stageTitle">Oyun</div>
    <div class="stage-score" id="stageScore">0</div>
  </div>
  <div id="game-container"></div>
</div>

<script>
// SES MOTORU (HARİCİ DOSYA GEREKTİRMEZ)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq = 440, type = 'sine', dur = 0.1) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// OYUN LİSTESİ (İLK 5 AKTİF OYUN + GENİŞLETİLEBİLİR SLOTLAR)
const GAMES = [
  { id: 'merge', title: 'Yaratık Birleştirme', icon: '🐉', cat: 'zeka', catName: 'Zeka & Evrim', ready: true },
  { id: 'snake', title: 'Klasik Yılan', icon: '🐍', cat: 'arcade', catName: 'Arcade', ready: true },
  { id: 'flappy', title: 'Zıplayan Kuş', icon: '🐤', cat: 'arcade', catName: 'Refleks', ready: true },
  { id: 'duel', title: '2 Kişilik Parmak Güreşi', icon: '🥊', cat: '2kisilik', catName: '2 Kişilik', ready: true },
  { id: 'memory', title: 'Kart Eşleştirme', icon: '🃏', cat: 'zeka', catName: 'Hafıza', ready: true }
];

let currentCat = 'hepsi';
let favs = JSON.parse(localStorage.getItem('offline_favs') || '[]');
let activeLoop = null;

function setCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderGames();
}

function toggleFav(e, id) {
  e.stopPropagation();
  if (favs.includes(id)) favs = favs.filter(x => x !== id);
  else favs.push(id);
  localStorage.setItem('offline_favs', JSON.stringify(favs));
  renderGames();
}

function renderGames() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';

  GAMES.filter(g => {
    const matchCat = currentCat === 'hepsi' || (currentCat === 'favori' && favs.includes(g.id)) || g.cat === currentCat;
    const matchQ = g.title.toLowerCase().includes(q);
    return matchCat && matchQ;
  }).forEach(g => {
    const isFav = favs.includes(g.id);
    const card = document.createElement('div');
    card.className = 'game-card';
    card.onclick = () => launchGame(g);
    card.innerHTML = `
      <span class="tag-ready">OYNA</span>
      <span class="fav-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFav(event, '${g.id}')">${isFav ? '⭐' : '☆'}</span>
      <div class="game-icon">${g.icon}</div>
      <div class="game-title">${g.title}</div>
      <div class="game-cat">${g.catName}</div>
    `;
    grid.appendChild(card);
  });
}

function closeGame() {
  if (activeLoop) { clearInterval(activeLoop); cancelAnimationFrame(activeLoop); activeLoop = null; }
  document.getElementById('game-stage').style.display = 'none';
  document.getElementById('launcher').style.display = 'flex';
  document.getElementById('game-container').innerHTML = '';
}

function launchGame(g) {
  beep(520, 'triangle', 0.12);
  document.getElementById('launcher').style.display = 'none';
  document.getElementById('game-stage').style.display = 'flex';
  document.getElementById('stageTitle').innerText = g.icon + ' ' + g.title;
  document.getElementById('stageScore').innerText = '0';
  const box = document.getElementById('game-container');
  box.innerHTML = '';

  if (g.id === 'merge') startMerge(box);
  else if (g.id === 'snake') startSnake(box);
  else if (g.id === 'flappy') startFlappy(box);
  else if (g.id === 'duel') startDuel(box);
  else if (g.id === 'memory') startMemory(box);
}

/* 1. YARATIK BİRLEŞTİRME OYUNU */
function startMerge(box) {
  const monsters = ['', '🥚', '🐣', '🐸', '🦊', '🦁', '🦖', '🦄', '👾', '🐲', '👑'];
  let grid = Array(16).fill(0);
  let selected = -1;
  let score = 0;
  grid[0] = 1; grid[1] = 1;

  const gridEl = document.createElement('div');
  gridEl.className = 'merge-grid';
  const btn = document.createElement('button');
  btn.className = 'big-action';
  btn.innerText = '🥚 Yumurta Çıkar';

  function draw() {
    gridEl.innerHTML = '';
    grid.forEach((lvl, i) => {
      const c = document.createElement('div');
      c.className = 'm-cell' + (selected === i ? ' selected' : '');
      if (lvl > 0) c.innerHTML = `${monsters[lvl]}<span>Sv.${lvl}</span>`;
      c.onclick = () => {
        if (lvl === 0) { selected = -1; draw(); return; }
        if (selected === -1) { selected = i; beep(350); }
        else if (selected === i) { selected = -1; }
        else if (grid[selected] === grid[i] && grid[i] < 10) {
          grid[i]++;
          grid[selected] = 0;
          selected = -1;
          score += grid[i] * 10;
          document.getElementById('stageScore').innerText = score;
          beep(680, 'triangle', 0.15);
        } else {
          selected = i;
        }
        draw();
      };
      gridEl.appendChild(c);
    });
  }

  btn.onclick = () => {
    const empties = grid.map((v, i) => v === 0 ? i : -1).filter(i => i !== -1);
    if (empties.length > 0) {
      const r = empties[Math.floor(Math.random() * empties.length)];
      grid[r] = 1;
      beep(480);
      draw();
    }
  };

  box.appendChild(gridEl);
  box.appendChild(btn);
  draw();
}

/* 2. KLASİK YILAN OYUNU */
function startSnake(box) {
  const canvas = document.createElement('canvas');
  canvas.width = 300; canvas.height = 300;
  box.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let snake = [{x: 7, y: 7}], dir = {x: 1, y: 0}, food = {x: 10, y: 10}, score = 0;

  let sx = 0, sy = 0;
  canvas.ontouchstart = e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
  canvas.ontouchend = e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
    else dir = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  };

  activeLoop = setInterval(() => {
    const head = {x: (snake[0].x + dir.x + 15) % 15, y: (snake[0].y + dir.y + 15) % 15};
    if (snake.some(s => s.x === head.x && s.y === head.y)) { snake = [{x:7,y:7}]; score = 0; beep(180,'sawtooth',0.2); }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10; document.getElementById('stageScore').innerText = score;
      food = {x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*15)};
      beep(600);
    } else snake.pop();

    ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,300,300);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(food.x*20+2, food.y*20+2, 16, 16);
    ctx.fillStyle = '#22c55e'; snake.forEach(s => ctx.fillRect(s.x*20+1, s.y*20+1, 18, 18));
  }, 140);
}

/* 3. ZIPLAMALI KUŞ OYUNU */
function startFlappy(box) {
  const canvas = document.createElement('canvas');
  canvas.width = 300; canvas.height = 420;
  box.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let y = 200, vy = 0, pipeX = 300, gapY = 140, score = 0;

  canvas.onpointerdown = () => { vy = -6.5; beep(500, 'sine', 0.08); };

  function loop() {
    vy += 0.35; y += vy; pipeX -= 3;
    if (pipeX < -40) { pipeX = 300; gapY = 70 + Math.random()*200; score++; document.getElementById('stageScore').innerText = score; beep(700); }
    if (y < 0 || y > 400 || (pipeX < 75 && pipeX > 15 && (y < gapY || y > gapY + 110))) {
      y = 200; vy = 0; pipeX = 300; score = 0; document.getElementById('stageScore').innerText = 0; beep(150,'sawtooth',0.2);
    }
    ctx.fillStyle = '#0ea5e9'; ctx.fillRect(0,0,300,420);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(pipeX, 0, 45, gapY); ctx.fillRect(pipeX, gapY+110, 45, 420);
    ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(50, y, 14, 0, Math.PI*2); ctx.fill();
    activeLoop = requestAnimationFrame(loop);
  }
  loop();
}

/* 4. 2 KİŞİLİK PARMAK GÜREŞİ */
function startDuel(box) {
  let p1 = 50;
  const wrap = document.createElement('div');
  wrap.className = 'duel-wrap';
  wrap.innerHTML = `<div class="duel-p2" id="dp2">🔴 DOKUN!</div><div class="duel-p1" id="dp1">🔵 DOKUN!</div>`;
  box.appendChild(wrap);

  const update = () => {
    document.getElementById('dp1').style.flex = p1;
    document.getElementById('dp2').style.flex = 100 - p1;
    if (p1 >= 95) { alert('🔵 MAVİ KAZANDI!'); p1 = 50; update(); }
    if (p1 <= 5) { alert('🔴 KIRMIZI KAZANDI!'); p1 = 50; update(); }
  };
  document.getElementById('dp1').onpointerdown = () => { p1 += 4; beep(550); update(); };
  document.getElementById('dp2').onpointerdown = () => { p1 -= 4; beep(420); update(); };
}

/* 5. HAFIZA KARTLARI */
function startMemory(box) {
  const icons = ['🐶','🐱','🦁','🐸','🐵','🦊','🐼','🐨'];
  let deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
  let open = [], matched = 0;
  const grid = document.createElement('div');
  grid.className = 'mem-grid';

  deck.forEach((ic, idx) => {
    const c = document.createElement('div');
    c.className = 'mem-card';
    c.innerText = '?';
    c.onclick = () => {
      if (open.length === 2 || c.classList.contains('open')) return;
      c.classList.add('open'); c.innerText = ic; beep(460);
      open.push({c, ic});
      if (open.length === 2) {
        if (open[0].ic === open[1].ic) {
          matched += 2; open = []; beep(700);
          document.getElementById('stageScore').innerText = matched * 10;
        } else {
          setTimeout(() => {
            open.forEach(o => { o.c.classList.remove('open'); o.c.innerText = '?'; });
            open = [];
          }, 650);
        }
      }
    };
    grid.appendChild(c);
  });
  box.appendChild(grid);
}

renderGames();
</script>
</body>
</html>
