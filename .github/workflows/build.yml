name: Android Uygulama Uretici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Capacitor ve Android Paketle
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "50 Oyun Offline" "com.soner.oyunmerkezi" --web-dir www
          npx cap add android
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: APK Dosyasini Indirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Test-APK-Dosyasi
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: PlayStore AAB Dosyasini Indirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-AAB-Paketi
          path: android/app/build/outputs/bundle/release/app-release.aab
          
